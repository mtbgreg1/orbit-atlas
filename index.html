<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A satellite globe for learning where the world's countries, India's states and China's provinces are.">
<meta name="theme-color" content="#04070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit Atlas">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%230a1d38'/%3E%3Cpath d='M20 18c6 2 8 8 4 12s2 10 8 8 6 8 2 12' fill='none' stroke='%234fd18b' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23f2b134' stroke-width='4'/%3E%3C/svg%3E">
<title>Orbit Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: dark;
  --space:#04070d;
  --panel:rgba(12,18,28,.86);
  --panel-solid:#0c121c;
  --line:rgba(170,190,215,.16);
  --line-strong:rgba(170,190,215,.32);
  --ink:#e9eef4;
  --muted:#93a1b3;
  --faint:#5f6d80;
  --accent:#f2b134;
  --accent-ink:#1b1204;
  --good:#4fd18b;
  --bad:#ff6b5e;
  --learn:#f2b134;
  --chip:rgba(255,255,255,.06);
  --chip-on:rgba(242,177,52,.16);
  --display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#globe.dragging{cursor:grabbing}
#globe.pointing{cursor:crosshair}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:500 11px/1 var(--sans);color:#fff;letter-spacing:.02em;
  text-shadow:0 0 3px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,.9);will-change:transform;transform-origin:0 0}
.lbl.big{font:600 12.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.lbl.terr{color:#cfd7e2;font-style:italic;font-weight:400}
.mark{position:absolute;left:0;top:0;pointer-events:none}
.mark .ring{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);box-shadow:0 0 0 2px rgba(0,0,0,.45);animation:pulse 1.6s ease-out infinite}
.mark.good .ring{border-color:var(--good)} .mark.bad .ring{border-color:var(--bad)}
.mark .tag{position:absolute;left:14px;top:-26px;background:var(--panel-solid);border:1px solid var(--line-strong);padding:4px 8px;border-radius:6px;font:600 12px/1.2 var(--sans);white-space:nowrap}
.mark.good .tag{border-color:var(--good);color:var(--good)} .mark.bad .tag{border-color:var(--bad);color:var(--bad)}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.35);opacity:.35}}
@media (prefers-reduced-motion: reduce){.mark .ring{animation:none}}
#tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:6px;padding:5px 9px;font:500 12.5px/1.2 var(--sans);white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#tip small{color:var(--muted);font-weight:400;margin-left:6px}

/* chrome */
.bar{position:absolute;display:flex;gap:10px;align-items:center}
#top{top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;flex-wrap:wrap;pointer-events:none}
#top > *{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:8px;font:600 22px/1 var(--display);letter-spacing:.01em;margin-right:6px;text-shadow:0 0 4px #000,0 1px 8px rgba(0,0,0,.8)}
.brand em{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#c3ccd8;font-style:normal;text-shadow:0 0 3px #000,0 0 6px #000}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button{all:unset;cursor:pointer;padding:7px 12px;border-radius:7px;font:500 13px/1 var(--sans);color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:focus-visible,.btn:focus-visible,.chip:focus-visible,.tog:focus-visible,.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#layers{margin-left:auto;display:flex;gap:6px}
.tog{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:7px 11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font:500 12.5px/1 var(--sans);color:var(--muted);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tog i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--faint)}
.tog[aria-pressed="true"]{color:var(--ink);border-color:var(--line-strong)}
.tog[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.tog:disabled{opacity:.4;cursor:not-allowed}

#panel{position:absolute;left:16px;top:calc(68px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 140px - env(safe-area-inset-top,0px));overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.sec{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sec + .sec{border-top:1px solid var(--line)}
.eyebrow{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
select,input[type=text],input[type=password]{font:500 14px/1.2 var(--sans);color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;width:100%;box-sizing:border-box}
select:focus-visible,input[type=text]:focus-visible,input[type=password]:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select option{background:var(--panel-solid)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:5px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font:500 12px/1.1 var(--sans);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:rgba(242,177,52,.55);color:var(--ink)}
.chip .n{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:4px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid var(--line-strong);font:500 13px/1 var(--sans);color:var(--ink);text-align:center}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:rgba(255,107,94,.4)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1}
kbd{font:500 10px/1 var(--mono);padding:2px 4px;border:1px solid var(--line-strong);border-radius:4px;color:var(--muted)}

/* quiz */
.prompt{display:flex;align-items:center;gap:12px;min-height:44px}
.flag{font-size:34px;line-height:1}
.prompt h2{margin:0;font:600 32px/1.02 var(--display);text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:-4px}
.hint{font-size:13px;line-height:1.45;color:#d7dee8;background:rgba(242,177,52,.08);border:1px dashed rgba(242,177,52,.4);border-radius:8px;padding:8px 10px}
.fb{font-size:14px;line-height:1.4;border-radius:9px;padding:10px 12px;border:1px solid}
.fb b{font-weight:600}
.fb.good{border-color:rgba(79,209,139,.5);background:rgba(79,209,139,.1)}
.fb.bad{border-color:rgba(255,107,94,.5);background:rgba(255,107,94,.1)}
.fb .cap{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{all:unset;cursor:pointer;box-sizing:border-box;padding:11px 10px;border-radius:9px;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);font:500 13.5px/1.25 var(--sans);display:flex;gap:8px;align-items:flex-start;min-height:44px}
.choice:hover:not(:disabled){background:rgba(255,255,255,.1)}
.choice kbd{margin-top:1px}
.choice.good{border-color:var(--good);background:rgba(79,209,139,.16)}
.choice.bad{border-color:var(--bad);background:rgba(255,107,94,.16)}
.choice:disabled{cursor:default}
.score{display:flex;gap:14px;font:500 12px/1 var(--mono);color:var(--muted)}
.score b{color:var(--ink);font-weight:500}
.opt{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.opt input{accent-color:var(--accent);width:15px;height:15px;margin:0}

/* explore */
.info-head{display:flex;gap:12px;align-items:center}
.info-head .flag{font-size:40px}
.info-head h2{margin:0;font:600 30px/1.02 var(--display);text-wrap:balance}
.kv{display:grid;grid-template-columns:92px 1fr;gap:7px 10px;margin:0;font-size:13px}
.kv dt{color:var(--muted);font:500 10.5px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.kv dd{margin:0;line-height:1.45}
.kv .mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.linkish{all:unset;cursor:pointer;color:var(--ink);border-bottom:1px dotted var(--faint)}
.linkish:hover{color:var(--accent);border-color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.m{color:var(--good);border-color:rgba(79,209,139,.5)} .status.m i{background:var(--good)}
.status.l{color:var(--learn);border-color:rgba(242,177,52,.5)} .status.l i{background:var(--learn)}
.status.w{color:var(--bad);border-color:rgba(255,107,94,.5)} .status.w i{background:var(--bad)}
.empty{color:var(--muted);font-size:13px;line-height:1.5}
.results{display:flex;flex-direction:column;max-height:220px;overflow:auto;margin-top:-4px;border:1px solid var(--line);border-radius:8px}
.results button{all:unset;cursor:pointer;padding:8px 10px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.results button:hover,.results button.on{background:rgba(255,255,255,.08)}
.results small{color:var(--muted);margin-left:auto;font-size:11.5px}

/* progress */
.big-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font:600 26px/1 var(--display);font-variant-numeric:lining-nums tabular-nums}
.stat span{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat.m b{color:var(--good)} .stat.l b{color:var(--learn)}
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:12.5px}
.barrow .num{font:500 11px/1.4 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.track{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(255,255,255,.07);display:flex;overflow:hidden}
.track i{display:block;height:100%}
.track .m{background:var(--good)} .track .l{background:var(--learn)}
.weak{display:flex;flex-direction:column;gap:2px}
.weak button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 6px;border-radius:6px;font-size:13px}
.weak button:hover{background:rgba(255,255,255,.07)}
.weak .mono{font:500 11px/1 var(--mono);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.note{font-size:12px;color:var(--faint);line-height:1.5;margin:0}
.note a,.steps a{color:var(--accent)}
.steps{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.sync{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}

#hud{left:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font:500 11px/1.5 var(--mono);color:var(--muted);flex-direction:column;align-items:flex-start;gap:2px;pointer-events:none;text-shadow:0 1px 3px #000}
#coords{color:#dde4ec;text-shadow:0 0 3px #000,0 1px 2px #000;font-variant-numeric:tabular-nums}
#attrib{font-size:10px;color:#b9c3d0;text-shadow:0 0 3px #000,0 1px 2px #000,0 0 6px rgba(0,0,0,.8);pointer-events:auto;max-width:min(720px,70vw)}
#attrib a{color:inherit}
textarea{font:400 12px/1.4 var(--mono);color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line-strong);border-radius:8px;padding:8px;width:100%;box-sizing:border-box;min-height:70px;resize:vertical;word-break:break-all}
#zoom{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:6px}
#zoom .btn{width:40px;height:40px;padding:0;background:var(--panel);font-size:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#zoom .btn svg{width:18px;height:18px}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

@media (max-width: 760px){
  .brand{font-size:19px}
  .brand em{display:none}
}
@media (max-width: 520px){
  .brand{display:none}
  #top{gap:8px}
  #layers{margin-left:0;width:100%;order:3}
  .tog{padding:6px 9px;font-size:12px}
  .seg button{padding:7px 9px;font-size:12.5px}
  #panel{left:8px;right:8px;width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:46%;border-radius:14px;display:flex;flex-direction:column}
  #setbar{order:2;border-top:1px solid var(--line)}
  #panel .sec + .sec{border-top:0}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chip{white-space:nowrap;flex:none}
  .sec{padding:12px 14px}
  .prompt h2{font-size:26px}
  #hud{display:none}
  #zoom{bottom:auto;top:calc(116px + env(safe-area-inset-top,0px));right:12px}
  #zoom .btn{width:36px;height:36px}
}
</style>
<style>[hidden]{display:none!important} body{margin:0} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<div id="app">
  <canvas id="globe" aria-label="Interactive satellite globe. Drag to rotate, scroll or pinch to zoom."></canvas>
  <div id="labels"></div>
  <div id="tip" hidden></div>
  <div id="loading">Loading satellite imagery…</div>

  <header id="top" class="bar">
    <div class="brand">Orbit Atlas <em>geography trainer</em></div>
    <nav class="seg" id="modes" role="tablist" aria-label="Mode">
      <button role="tab" data-mode="explore" aria-selected="true">Explore</button>
      <button role="tab" data-mode="find" aria-selected="false">Find it</button>
      <button role="tab" data-mode="name" aria-selected="false">Name it</button>
      <button role="tab" data-mode="progress" aria-selected="false">Progress</button>
    </nav>
    <div id="layers">
      <button class="tog" id="t-borders" aria-pressed="true"><i></i>Borders</button>
      <button class="tog" id="t-labels" aria-pressed="true"><i></i>Labels</button>
      <button class="tog" id="t-mastery" aria-pressed="false"><i></i>Mastery</button>
      <button class="tog" id="t-esri" aria-pressed="false" title="Switch close-up imagery between Sentinel-2 and Esri"><i></i>Esri imagery</button>
    </div>
  </header>

  <aside id="panel">
    <section class="sec" id="setbar">
      <div class="eyebrow"><span>Study set</span><span id="pool-count"></span></div>
      <select id="set" aria-label="Study set">
        <option value="world">World countries</option>
        <option value="IND">India: states &amp; union territories</option>
        <option value="CHN">China: provinces &amp; regions</option>
      </select>
      <div class="chips" id="chips" role="group" aria-label="Regions"></div>
    </section>

    <section class="sec" id="p-explore">
      <input type="text" id="search" placeholder="Search a place…" autocomplete="off" aria-label="Search">
      <div class="results" id="results" hidden></div>
      <div id="info"></div>
    </section>

    <section class="sec" id="p-quiz" hidden>
      <div class="eyebrow"><span id="q-eyebrow">Find it on the globe</span><span id="q-left"></span></div>
      <div class="prompt" id="q-prompt"><span class="flag" id="q-flag"></span><h2 id="q-name"></h2></div>
      <div class="sub" id="q-sub"></div>
      <div class="choices" id="q-choices" hidden></div>
      <form id="q-typed" class="row" hidden autocomplete="off">
        <input type="text" id="q-input" class="grow" placeholder="Type the name…" aria-label="Your answer" spellcheck="false">
        <button class="btn primary" type="submit">Check</button>
      </form>
      <div class="hint" id="q-hint" hidden></div>
      <div class="fb" id="q-fb" hidden></div>
      <div class="row">
        <button class="btn" id="q-hintbtn">Hint</button>
        <button class="btn" id="q-skip">Show me</button>
        <span class="grow"></span>
        <button class="btn primary" id="q-next" hidden>Next <kbd>↵</kbd></button>
      </div>
      <div class="row" style="justify-content:space-between">
        <div class="score"><span>Score <b id="q-score">0/0</b></span><span>Streak <b id="q-streak">0</b></span></div>
      </div>
      <div class="row" style="gap:16px">
        <label class="opt"><input type="checkbox" id="o-weak"> Focus on weak spots</label>
        <label class="opt" id="o-typing-wrap" hidden><input type="checkbox" id="o-typing"> Type answers</label>
      </div>
    </section>

    <section class="sec" id="p-progress" hidden></section>
  </aside>

  <div id="hud" class="bar"><span id="coords">—</span><span id="attrib"></span></div>
  <div id="zoom" class="bar">
    <button class="btn" id="z-in" aria-label="Zoom in">+</button>
    <button class="btn" id="z-out" aria-label="Zoom out">−</button>
    <button class="btn" id="z-home" aria-label="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.3 3.8 5.2 3.8 8.5s-1.2 6.2-3.8 8.5c-2.6-2.3-3.8-5.2-3.8-8.5s1.2-6.2 3.8-8.5z"/></svg></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const DEG = Math.PI / 180;
const MIN_ALT = 0.0012, MAX_ALT = 4.2;
const GROUPS = {africa:'Africa', europe:'Europe', mideast:'Middle East & Caucasus', scasia:'South & Central Asia', easia:'East & Southeast Asia', oceania:'Oceania', namerica:'North America', carib:'Central America & Caribbean', samerica:'South America'};
const GROUP_VIEW = {africa:[3,20,1.9], europe:[52,14,1.15], mideast:[31,45,1.15], scasia:[32,70,1.35], easia:[22,115,1.7], oceania:[-14,155,2.1], namerica:[45,-100,1.8], carib:[16,-78,0.95], samerica:[-18,-60,1.8]};
const SET_VIEW = {world:[20,15,2.4], IND:[22.5,81,0.62], CHN:[34,104,0.95]};
const SET_NOUN = {world:'country', IND:'state or UT', CHN:'province or region'};
const SET_NOUNS = {world:'countries', IND:'states & UTs', CHN:'provinces & regions'};

/* ---------------- storage helpers ---------------- */

function ll2v(lon, lat, r = 1, out){
  const cl = Math.cos(lat * DEG);
  out = out || new THREE.Vector3();
  return out.set(r * cl * Math.sin(lon * DEG), r * Math.sin(lat * DEG), r * cl * Math.cos(lon * DEG));
}
function v2ll(v){ const r = v.length(); return [Math.atan2(v.x, v.z) / DEG, Math.asin(Math.max(-1, Math.min(1, v.y / r))) / DEG]; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const mercLat = (t) => Math.atan(Math.sinh(Math.PI * (1 - 2 * t))) / DEG; // t in [0,1] from north

function gridGeom(lon0, lon1, lat0, lat1, sx, sy, r, uvFn){
  // lat0 = north edge, lat1 = south edge
  const pos = [], uv = [], idx = [], v = new THREE.Vector3();
  for (let j = 0; j <= sy; j++){
    const t = j / sy;
    const lat = uvFn && uvFn.merc ? mercLat(uvFn.y0 + t * uvFn.dy) : lat0 + (lat1 - lat0) * t;
    for (let i = 0; i <= sx; i++){
      const lon = lon0 + (lon1 - lon0) * i / sx;
      ll2v(lon, lat, r, v); pos.push(v.x, v.y, v.z);
      if (uvFn && uvFn.equi) uv.push((lon + 180) / 360, (lat + 90) / 180); else uv.push(i / sx, t);
    }
  }
  for (let j = 0; j < sy; j++) for (let i = 0; i < sx; i++){
    const a = j * (sx + 1) + i, b = a + 1, c = a + sx + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

const tileInfoCache = new Map();
const TILE_SEG = [72, 40, 24, 14, 10, 8, 8, 8, 6, 6, 4, 4, 4, 4, 4, 4, 4];
function tileInfo(z, x, y){
  const k = z + '/' + x + '/' + y; let t = tileInfoCache.get(k); if (t) return t;
  const n = 1 << z;
  const lon0 = x / n * 360 - 180, lon1 = (x + 1) / n * 360 - 180;
  const latN = mercLat(y / n), latS = mercLat((y + 1) / n);
  const c = ll2v((lon0 + lon1) / 2, mercLat((y + 0.5) / n));
  let ang = 0; const v = new THREE.Vector3();
  for (const [lo, la] of [[lon0, latN], [lon1, latN], [lon0, latS], [lon1, latS], [(lon0 + lon1) / 2, latN], [(lon0 + lon1) / 2, latS]]){
    ang = Math.max(ang, c.angleTo(ll2v(lo, la, 1, v)));
  }
  t = {c, ang, lon0, lon1};
  if (tileInfoCache.size > 20000) tileInfoCache.clear();
  tileInfoCache.set(k, t); return t;
}
const queue = []; let active = 0, selGen = 0;
const MAX_ACTIVE = 10;
function pending(){ return active > 0 || queue.length > 0; }
function ensureTile(z, x, y){
  const k = tkey(z, x, y); let t = tiles.get(k);
  if (t){
    if (t.state === 'queued') t.want = selGen;
    if (t.state === 'missing' && performance.now() - t.failAt > 20000){ tiles.delete(k); return ensureTile(z, x, y); }
    return t;
  }
  t = {state: 'queued', mesh: null, used: 0, z, x, y, src: srcFor(z), key: k, want: selGen};
  tiles.set(k, t); queue.push(t); pump();
  return t;
}
function pump(){
  if (!queue.length) return;
  queue.sort((a, b) => (b.want - a.want) || (a.z - b.z));
  while (active < MAX_ACTIVE && queue.length){
    const t = queue.shift();
    if (selGen - t.want > 2){ tiles.delete(t.key); continue; } // no longer on screen
    active++; t.state = 'loading';
    loadTile(t).finally(() => { active--; dirty = true; pump(); });
  }
}
async function loadTile(t){
  try {
    const r = await fetch(tileURL(t), {mode: 'cors'});
    if (!r.ok) throw new Error(r.status);
    const blob = await r.blob();
    let img;
    try { img = await createImageBitmap(blob); }
    catch (err){ img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(blob); }); }
    if (tiles.get(t.key) !== t){ if (img.close) img.close(); return; }
    const tex = new THREE.Texture(img);
    tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = Math.min(8, maxAniso);
    tex.minFilter = THREE.LinearMipmapLinearFilter; tex.needsUpdate = true;
    const z = t.z, n = 1 << z, seg = TILE_SEG[z] || 4;
    const geom = gridGeom(t.x / n * 360 - 180, (t.x + 1) / n * 360 - 180, 0, 0, seg, seg, 1, {merc: true, y0: t.y / n, dy: 1 / n});
    t.mesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({map: tex}));
    t.mesh.visible = false; t.mesh.userData.img = img;
    tileGroup.add(t.mesh);
    t.state = 'ready';
    if (z === 0) samplePoles(img);
  } catch (e){ t.state = 'missing'; t.failAt = performance.now(); }
}

const camDir = new THREE.Vector3();
let viewAngle = 1, pxScale = 1;
function visibleTile(info){ return info.c.angleTo(camDir) < viewAngle + info.ang; }
function wantSplit(info){
  const d = camera.position.distanceTo(info.c);
  const px = (info.ang * 1.414) / d * pxScale * DPR;
  return px > 300;
}
function selectTiles(){
  const out = [];
  const visit = (z, x, y) => {
    const info = tileInfo(z, x, y);
    if (z > 0 && !visibleTile(info)) return;
    const t = tiles.get(tkey(z, x, y));
    if (z < maxZ() && wantSplit(info)){
      const kids = [];
      for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++){
        const cz = z + 1, cx = x * 2 + dx, cy = y * 2 + dy;
        if (!visibleTile(tileInfo(cz, cx, cy))) continue;
        kids.push([cz, cx, cy, ensureTile(cz, cx, cy)]);
      }
      if (kids.length && kids.every(k => k[3].state === 'ready' || k[3].state === 'missing') && kids.some(k => k[3].state === 'ready')){
        const missing = kids.some(k => k[3].state === 'missing');
        if (!missing){ kids.forEach(k => visit(k[0], k[1], k[2])); return; }
      }
    }
    if (t && t.state === 'ready') out.push(t);
  };
  visit(0, 0, 0);
  return out;
}
let frame = 0;
function updateTiles(){
  selGen++;
  const sel = selectTiles();
  for (const t of tiles.values()) if (t.mesh) t.mesh.visible = false;
  for (const t of sel){ t.mesh.visible = true; t.used = frame; }
  // evict
  if (tiles.size > 700){
    const cands = [...tiles.entries()].filter(([k, t]) => t.state === 'ready' && (t.z > 3 || t.src !== 'bm') && t.used < frame - 30).sort((a, b) => a[1].used - b[1].used);
    for (const [k, t] of cands.slice(0, tiles.size - 600)){
      tileGroup.remove(t.mesh); t.mesh.geometry.dispose(); t.mesh.material.map.dispose(); t.mesh.material.dispose();
      if (t.mesh.userData.img && t.mesh.userData.img.close) t.mesh.userData.img.close();
      tiles.delete(k);
    }
  }
}

/* ---------------- borders (ribbon lines) ---------------- */
const LINE_VS = `
attribute vec3 aDir; attribute float aSide;
uniform float uWidth; uniform float uLift;
void main(){
  vec3 n = normalize(position);
  vec3 off = normalize(cross(n, aDir));
  vec3 p = (position + off * aSide * uWidth) * uLift;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;
const LINE_FS = `uniform vec3 uColor; uniform float uOpacity; void main(){ gl_FragColor = vec4(uColor, uOpacity); }`;
const lineMats = [];
function lineMat(color, opacity, px, lift){
  const m = new THREE.ShaderMaterial({
    uniforms: {uColor: {value: new THREE.Color(color)}, uOpacity: {value: opacity}, uWidth: {value: 0.001}, uLift: {value: lift || 1.0006}},
    vertexShader: LINE_VS, fragmentShader: LINE_FS, transparent: true, depthWrite: false
  });
  m.userData.px = px; lineMats.push(m); return m;
}
function buildLines(itemsOrRings){
  const P = [], D = [], Sd = [], I = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), d = new THREE.Vector3();
  let vi = 0;
  const pushSeg = (lo1, la1, lo2, la2) => {
    ll2v(lo1, la1, 1, a); ll2v(lo2, la2, 1, b); d.subVectors(b, a);
    if (d.lengthSq() < 1e-14) return;
    P.push(a.x, a.y, a.z, a.x, a.y, a.z, b.x, b.y, b.z, b.x, b.y, b.z);
    for (let k = 0; k < 4; k++) D.push(d.x, d.y, d.z);
    Sd.push(1, -1, 1, -1);
    I.push(vi, vi + 1, vi + 2, vi + 1, vi + 3, vi + 2); vi += 4;
  };
  for (const ring of itemsOrRings){
    for (let i = 0; i + 3 < ring.length; i += 2){
      const lo1 = ring[i], la1 = ring[i + 1], lo2 = ring[i + 2], la2 = ring[i + 3];
      if (Math.abs(lo1) > 179.9 && Math.abs(lo2) > 179.9) continue;
      if (la1 < -89.5 && la2 < -89.5) continue;
      if (Math.abs(lo2 - lo1) > 180) continue;
      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(lo2 - lo1), Math.abs(la2 - la1)) / 0.3));
      for (let s = 0; s < steps; s++){
        const t0 = s / steps, t1 = (s + 1) / steps;
        pushSeg(lo1 + (lo2 - lo1) * t0, la1 + (la2 - la1) * t0, lo1 + (lo2 - lo1) * t1, la1 + (la2 - la1) * t1);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('aDir', new THREE.Float32BufferAttribute(D, 3));
  g.setAttribute('aSide', new THREE.Float32BufferAttribute(Sd, 1));
  g.setIndex(vi > 65535 ? new THREE.Uint32BufferAttribute(I, 1) : new THREE.Uint16BufferAttribute(I, 1));
  return g;
}

function prepItem(it){
  let minx = 999, miny = 999, maxx = -999, maxy = -999, best = null, bestA = -1;
  for (const poly of it.poly){
    const r = poly[0]; let a0 = 999, b0 = 999, a1 = -999, b1 = -999;
    for (let i = 0; i < r.length; i += 2){ a0 = Math.min(a0, r[i]); a1 = Math.max(a1, r[i]); b0 = Math.min(b0, r[i + 1]); b1 = Math.max(b1, r[i + 1]); }
    minx = Math.min(minx, a0); maxx = Math.max(maxx, a1); miny = Math.min(miny, b0); maxy = Math.max(maxy, b1);
    const ar = (a1 - a0) * (b1 - b0); if (ar > bestA){ bestA = ar; best = [a0, b0, a1, b1]; }
  }
  it.bb = [minx, miny, maxx, maxy]; it.mbb = best || it.bb;
  it.lv = ll2v(it.lab[0], it.lab[1]);
  it.size = Math.sqrt(Math.max(it.area, 1)) / 6371; // approx angular size in radians
  it.tiny = it.area < 4000;
  it.pool = it.k !== 'territory' && it.g !== 'other';
}
function pip(it, lon, lat){
  const b = it.bb; if (lon < b[0] || lon > b[2] || lat < b[1] || lat > b[3]) return false;
  let inside = false;
  for (const poly of it.poly) for (const r of poly){
    for (let i = 0, j = r.length - 2; i < r.length; j = i, i += 2){
      const xi = r[i], yi = r[i + 1], xj = r[j], yj = r[j + 1];
      if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
    }
  }
  return inside;
}

const P = {data: {}, updated: 0, resets: {}};
{

function rec(id){ return P.data[id]; }
function status(id){
  const r = P.data[id]; if (!r) return 'new';

  if (r[0] === 0 && r[2] > 0) return 'w';

function record(id, correct, hinted){
  const r = P.data[id] ? P.data[id].slice() : [0, 0, 0, 0];
  if (correct){ r[1]++; if (!hinted) r[0] = Math.min(5, r[0] + 1); }
  else { r[2]++; r[0] = Math.max(0, r[0] - 2); }

const canon = o => JSON.stringify(Object.keys(o || {}).sort().map(k => [k, o[k]]));
function mergeRemote(remote){
  const resets = Object.assign({}, P.resets);
  for (const [k, v] of Object.entries(remote.resets || {})) if (!resets[k] || v > resets[k]) resets[k] = v;
  const out = Object.assign({}, P.data);
  for (const [id, r] of Object.entries(remote.data || {})) if (Array.isArray(r) && (!out[id] || r[3] > out[id][3])) out[id] = r;
  for (const [id, r] of Object.entries(out)){ const it = BYID.get(id); const rs = it && resets[it.set]; if (rs && r[3] <= rs) delete out[id]; }
  P.data = out; P.resets = resets; saveLocal();
}
const GH = {token: ls.get('oa-gh-token', null), gist: ls.get('oa-gh-gist', null), state: 'off', error: '', last: 0, busy: false, again: false, timer: null};
if (GH.token) GH.state = 'idle';
const GFILE = 'orbit-atlas-progress.json';
async function gh(path, opts = {}){
  const headers = {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + GH.token};
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch('https://api.github.com' + path, Object.assign({}, opts, {headers, cache: 'no-store'}));
  if (!r.ok){ const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
function payload(){ return JSON.stringify({v: 1, app: 'orbit-atlas', updated: Date.now(), data: P.data, resets: P.resets}); }
async function findOrCreateGist(){
  if (GH.gist) return GH.gist;
  for (let page = 1; page <= 10 && !GH.gist; page++){
    const list = await gh('/gists?per_page=100&page=' + page);
    const g = list.find(g => g.files && g.files[GFILE]);
    if (g) GH.gist = g.id;
    if (list.length < 100) break;
  }
  if (!GH.gist){
    const g = await gh('/gists', {method: 'POST', body: JSON.stringify({description: 'Orbit Atlas progress (kept in sync by the app)', public: false, files: {[GFILE]: {content: payload()}}})});
    GH.gist = g.id;
  }
  ls.set('oa-gh-gist', GH.gist);
  return GH.gist;
}
function scheduleSync(){
  if (!GH.token) return;
  clearTimeout(GH.timer); GH.timer = setTimeout(ghSync, 4000);
}
async function ghSync(){
  if (!GH.token) return;
  if (GH.busy){ GH.again = true; return; }
  GH.busy = true; GH.state = 'syncing'; renderSync();
  const before = canon(P.data);
  try {
    const id = await findOrCreateGist();
    const g = await gh('/gists/' + id);
    const f = g.files && g.files[GFILE];
    let remote = null;
    if (f){
      let txt = f.content;
      if (f.truncated) txt = await (await fetch(f.raw_url, {cache: 'no-store'})).text();
      try { remote = JSON.parse(txt); } catch (e) { remote = null; }
    }
    if (remote) mergeRemote(remote);
    const same = remote && canon(remote.data) === canon(P.data) && canon(remote.resets) === canon(P.resets);
    if (!same) await gh('/gists/' + id, {method: 'PATCH', body: JSON.stringify({files: {[GFILE]: {content: payload()}}})});
    GH.state = 'ok'; GH.error = ''; GH.last = Date.now();
  } catch (e){
    GH.state = 'error';
    if (e.status === 401){ GH.error = 'GitHub didn’t accept this token. It may have expired or been deleted. Disconnect and paste a new one.'; }

  const show = labelsAllowed();

  if (show){
    const list = activeItems();
    const minPx = S.set === 'world' ? 30 : 16;
    for (const it of list){ // sorted by area desc
      if (it.lv.dot(camDir) < limbCos && selectedId !== it.id) continue;
      const s = screenOf(it.lv); if (!s) continue;

/* ---------------- quiz ---------------- */
const Q = {item: null, answered: false, hinted: false, choices: [], stats: {n: 0, c: 0, streak: 0}, recent: []};
function weightOf(it){
  const r = rec(it.id);
  if (!r) return 3;
  const age = (Date.now() - r[3]) / 60000; // minutes
  return Math.pow(6 - r[0], 2) * (r[0] >= 3 ? Math.min(1, 0.15 + age / 600) : 1) + (r[2] > r[1] ? 4 : 0);
}
function pickNext(){
  let pool = poolItems();
  if (S.weak){ const w = pool.filter(it => status(it.id) !== 'm'); if (w.length) pool = w; }
  const avoid = new Set(Q.recent.slice(-Math.min(8, Math.floor(pool.length / 2))));
  let cands = pool.filter(it => !avoid.has(it.id)); if (!cands.length) cands = pool;
  const ws = cands.map(weightOf); let tot = ws.reduce((a, b) => a + b, 0), r = Math.random() * tot;
  for (let i = 0; i < cands.length; i++){ r -= ws[i]; if (r <= 0) return cands[i]; }
  return cands[cands.length - 1];
}
function subFor(it){

}

  $('#q-prompt').hidden = !find;

  $('#q-sub').textContent = find ? subFor(it) : '';
  $('#q-sub').hidden = !find;

  $('#q-skip').textContent = find ? 'Show me' : 'Reveal';
  if (find){
    $('#q-choices').hidden = true; $('#q-typed').hidden = true;
    if (S.set !== 'world'){ /* keep view */ }
  } else {
    setOutline('target', it.id);

    marks = it.tiny ? [{id: it.id, ring: true}] : [];

    } else {
      $('#q-typed').hidden = true; $('#q-choices').hidden = false;
      Q.choices = makeChoices(it);
      $('#q-choices').innerHTML = Q.choices.map((c, i) => `<button class="choice" data-id="${c.id}"><kbd>${i + 1}</kbd><span>${esc(c.n)}</span></button>`).join('');
    }

}
function makeChoices(it){
  const same = poolItems().filter(o => o.id !== it.id);
  const all = activeItems().filter(o => o.pool && o.id !== it.id);
  const src = same.length >= 3 ? same : all;
  const byDist = src.map(o => [o.lv.angleTo(it.lv), o]).sort((a, b) => a[0] - b[0]);
  const near = byDist.slice(0, 8).map(x => x[1]);
  const picks = [];
  const take = (arr) => { const c = arr.filter(o => !picks.includes(o)); if (c.length) picks.push(c[Math.random() * c.length | 0]); };
  take(near); take(near); take(src.filter(o => !near.includes(o)).length ? src.filter(o => !near.includes(o)) : src);
  while (picks.length < 3) take(src);
  const out = [it, ...picks.slice(0, 3)];
  for (let i = out.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [out[i], out[j]] = [out[j], out[i]]; }

function lev(a, b){

function counts(list){ let m = 0, l = 0, n = 0; for (const it of list){ const s = status(it.id); if (s === 'm') m++; else if (s === 'new') n++; else l++; } return {m, l, n, t: list.length}; }

  else if (k === '-' || k === '_'){ flyTo(view.lat, view.lon, view.alt * 1.6, 350); }
  else if (S.mode === 'name' && !Q.answered && /^[1-4]$/.test(k) && !S.typing){ const c = Q.choices[+k - 1]; if (c) answerName(c.id); }
  else if ((k === 'Enter' || k === ' ') && Q.answered && (S.mode === 'find' || S.mode === 'name') && !e.target.closest('button')){ e.preventDefault(); clearTimeout(autoNext); newQuestion(); }
});

/* ---------------- loop ---------------- */
let lastTileUpdate = 0;
function loop(now){
  frame++;
  stepFly(now); stepInertia(now);
  if (dirty){
    dirty = false;
    updateTiles(); updateLabels();
    renderer.render(scene, camera);
    lastTileUpdate = now;
  } else if (pending() && now - lastTileUpdate > 250){ dirty = true; }
  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
async function boot(){
  resize(); addEventListener('resize', resize);
  const v = SET_VIEW[S.set]; view.lat = v[0]; view.lon = v[1]; view.alt = fit(v[2]); applyView();
  const geo = await fetch('geo.json').then(r => r.json());
  for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) ensureTile(1, x, y);
  ensureTile(0, 0, 0);
  ITEMS = geo.items;
  for (const it of ITEMS){ prepItem(it); BYID.set(it.id, it); BYSET[it.set].push(it); }
  for (const k in BYSET) BYSET[k].sort((a, b) => b.area - a.area);
  const lw = {world: [1.6, '#ffffff', 0.75], IND: [1.3, '#ffe7a8', 0.9], CHN: [1.3, '#ffe7a8', 0.9]};
  for (const k in BYSET){
    const m = new THREE.Mesh(buildLines(BYSET[k].flatMap(ringsOf)), lineMat(lw[k][1], lw[k][2], lw[k][0], k === 'world' ? 1.0007 : 1.0006));
    m.renderOrder = k === 'world' ? 4 : 3; m.frustumCulled = false; lineLayers[k] = m; scene.add(m);
  }
  for (const [slot, px] of [['hover', 2.2], ['sel', 3.2], ['target', 3.4], ['good', 3.4], ['bad', 3.4]]){
    const m = new THREE.Mesh(new THREE.BufferGeometry(), lineMat(COLORS[slot], slot === 'hover' ? 0.9 : 1, px, 1.0009));
    m.visible = false; m.renderOrder = 6; m.frustumCulled = false; m.userData.id = null; m.material.userData.top = true; outlines[slot] = m; scene.add(m);
  }
  $('#loading').hidden = true;
  renderChips(); updatePoolCount(); applyView();
  enterMode('explore', true);
  requestAnimationFrame(loop);
  if (GH.token) ghSync();
}
boot().catch(err => { $('#loading').textContent = 'Could not load map data. Reload to try again.'; console.error(err); });
})();
</script>
